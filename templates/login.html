<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sign in · HARITHA ENTERPRISES</title>
  <link rel="icon" href="/static/haritha.ico">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="auth-page">
  <main class="auth-card">
    <div class="auth-brand"><span class="brand-mark large" aria-hidden="true">HE</span><span class="brand-wordmark"><strong>HARITHA<br>ENTERPRISES</strong><small>STORE MANAGEMENT</small></span></div>
    <h1>Welcome back</h1>
    <p class="muted">Sign in to manage the store.</p>
    {% if error %}<div class="auth-error">{{ error }}</div>{% endif %}
    <form action="/login" method="post" class="auth-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label>Email or username<input type="text" name="username" autocomplete="username" required autofocus></label>
      <label>Password<input type="password" name="password" autocomplete="current-password" required></label>
      <button type="submit" class="btn primary wide">Sign in</button>
    </form>
    <p class="auth-foot">Ask your store administrator for access.</p>
  </main>
</body>
</html>
